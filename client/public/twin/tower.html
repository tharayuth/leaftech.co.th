*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--nb-foreground);-webkit-font-smoothing:antialiased;position:relative}
:root{--critf:#ef4444;--warnf:#f59e0b;--infof:#3b82f6;--okf:#22c55e;--idlef:#94a3b8;--stalef:#7b8494;
--crit:#f87171;--warn:#fbbf24;--info:#60a5fa;--ok:#4ade80;--idle:#94a3b8;
--fg:var(--nb-foreground);--mut:var(--nb-muted-foreground);--bd:var(--nb-border);--panel:var(--nb-muted);--bg:var(--nb-background);
--glass:color-mix(in srgb,var(--nb-background) 92%,transparent);--soft:color-mix(in srgb,var(--nb-foreground) 6%,transparent);
--line:color-mix(in srgb,var(--nb-foreground) 14%,transparent)}
:root[data-theme=light]{--crit:#dc2626;--warn:#b45309;--info:#2563eb;--ok:#15803d;--idle:#64748b;--critf:#ef4444;--warnf:#f59e0b}
.lv-critical{--c:var(--critf);--t:var(--crit)}
.lv-warning{--c:var(--warnf);--t:var(--warn)}
.lv-info{--c:var(--infof);--t:var(--info)}
.lv-ok{--c:var(--okf);--t:var(--ok)}
.lv-idle,.lv-none{--c:var(--idlef);--t:var(--mut)}
.lv-stale{--c:var(--stalef);--t:var(--mut)}
button{font:inherit;color:inherit;cursor:pointer}
.mut{color:var(--mut)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em;white-space:nowrap;
color:var(--t);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 42%,transparent)}
.chip.stale{border-style:dashed}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.lv-critical .dot.glow,.dot.glow.lv-critical{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 28%,transparent);animation:nbpulse 1.1s ease-in-out infinite}
.lv-ok .dot.glow{box-shadow:0 0 6px color-mix(in srgb,var(--c) 70%,transparent)}
@keyframes nbpulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 6%,transparent);opacity:.65}}
@keyframes nbflash{0%{background:color-mix(in srgb,var(--c) 38%,transparent)}100%{background:transparent}}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--glass)}
.seg button{border:0;background:transparent;padding:4px 12px;font-size:12px;font-weight:600;color:var(--mut)}
.seg button.on{background:color-mix(in srgb,var(--nb-foreground) 12%,transparent);color:var(--fg)}
.seg button:hover:not(.on){color:var(--fg)}
.panel{background:var(--glass);border:1px solid var(--bd);border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
#stage{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;user-select:none}
#stage.hand{cursor:pointer}
#labels,#leaders{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#leaders{overflow:visible}
.rl{position:absolute;left:0;top:0;max-width:232px;padding:4px 8px 5px 9px;border-radius:9px;pointer-events:auto;cursor:pointer;background:var(--glass);
border:1px solid var(--bd);border-left:3px solid var(--c);box-shadow:0 3px 12px #0003;will-change:transform;font-size:11px;line-height:1.3}
.rl .t{display:flex;align-items:center;gap:5px;white-space:nowrap}
.rl .t b{font-weight:700;font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.rl .chip{font-size:9px;padding:0 6px;margin-left:auto}
.rl .v{color:var(--mut);font-size:10.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rl .nt{color:var(--t);font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl.lv-critical{background:color-mix(in srgb,var(--c) 20%,var(--glass))}
.rl.hov{box-shadow:0 0 0 2px var(--c),0 6px 20px #0005;z-index:3}
.rl.mnt{border-left-color:transparent}
.rl.mnt::before{content:'';position:absolute;left:-4px;top:-1px;bottom:-1px;width:7px;border-radius:9px 0 0 9px;background:repeating-linear-gradient(135deg,#f59e0b 0 4px,#1f2937 4px 8px)}
.wr{display:none;width:16px;height:16px;border-radius:50%;background:#f59e0b;place-items:center;flex:none;box-shadow:0 0 0 2px color-mix(in srgb,#f59e0b 30%,transparent)}
.wr svg{width:10px;height:10px;stroke:#1f2937;fill:none;stroke-width:2.6;stroke-linecap:round}
.mnt .wr{display:grid}
.lb{display:none;font-size:8.5px;font-weight:800;letter-spacing:.07em;color:#fff;background:#0ea5e9;border-radius:4px;padding:0 4px;line-height:13px}
.live .lb{display:inline-block}
.col{position:absolute;top:10px;bottom:32px;width:236px;display:flex;flex-direction:column;gap:7px;z-index:5;overflow:hidden}
#colL{left:10px}#colR{right:10px}
.card{padding:7px 10px 6px;flex:none}
.ch{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:3px;white-space:nowrap}
.ch span{overflow:hidden;text-overflow:ellipsis}.ch .chip{flex:none}
.ch .chip{font-size:9px;padding:0 7px;letter-spacing:.04em}
.r{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;padding:2px 0;border-top:1px solid var(--line);min-height:21px}
.r span{color:var(--mut);white-space:nowrap}
.r b{font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.r b.chip{font-size:9.5px;padding:0 7px}
